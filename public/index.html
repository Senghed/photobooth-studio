<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhotoBooth Studio: ta, redigera och dela bilder i ett galleri.">
  <title>PhotoBooth Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>PhotoBooth Studio</h1>
  <main>
    <p id="status">Laddar...</p>

    <section id="logged-out" hidden>
      <form id="login-form">
        <h2>Logga in</h2>

        <label for="login-username">Användarnamn</label>
        <input id="login-username" name="username" type="text" required autocomplete="username">

        <label for="login-password">Lösenord</label>
        <input id="login-password" name="password" type="password" required autocomplete="current-password">

        <button type="submit">Logga in</button>
      </form>
      <p id="login-error" role="alert"></p>

      <form id="register-form">
        <h2>Skapa konto</h2>

        <label for="register-username">Användarnamn</label>
        <input id="register-username" name="username" type="text" required minlength="3" maxlength="30"
          autocomplete="username">

        <label for="register-password">Lösenord</label>
        <input id="register-password" name="password" type="password" required minlength="6"
          autocomplete="new-password">

        <button type="submit">Skapa konto</button>
      </form>
      <p id="register-error" role="alert"></p>
    </section>

    <section id="logged-in" hidden>
      <p>Inloggad som <strong id="current-user"></strong></p>
      <button id="logout-button" type="button">Logga ut</button>

      <div id="overview">
        <h2>Ladda upp foto</h2>
        <label for="photo-input">Ta eller välj ett foto</label>
        <input id="photo-input" type="file" accept="image/*" capture="environment">
        <p id="upload-status" role="status"></p>

        <h2>Mina bilder</h2>
        <p id="my-status" role="status"></p>
        <ul id="my-photos"></ul>

        <h2>Galleri</h2>

        <label for="search-input">Sök titel eller användare</label>
        <input id="search-input" type="search">

        <label for="sort-select">Sortera</label>
        <select id="sort-select">
          <option value="newest">Nyast först</option>
          <option value="oldest">Äldst först</option>
          <option value="title">Titel A-Ö</option>
        </select>

        <p id="gallery-status" role="status"></p>
        <ul id="gallery"></ul>


        <section id="admin-panel" hidden>
          <h2>Moderering</h2>
          <p id="admin-status" role="status"></p>
          <ul id="admin-list"></ul>
        </section>
      </div>

      <section id="editor" hidden>
        <h2 id="editor-title"></h2>
        <figure id="editor-frame">
          <div id="editor-photo" class="photo-frame">
            <img id="editor-image" alt="">
          </div>
        </figure>
        <label for="filter-select">Filter</label>
        <select id="filter-select">
          <option value="none">Inget</option>
          <option value="grayscale">Svartvit</option>
          <option value="sepia">Sepia</option>
          <option value="invert">Invertera</option>
        </select>

        <label for="filter-amount">Styrka</label>
        <input id="filter-amount" type="range" min="0" max="100" value="100">
        <div id="sticker-palette" role="group" aria-label="Välj klistermärke"></div>
        <div class="editor-actions">
          <button id="filter-save" type="button">Spara filter</button>
          <button type="button" id="sticker-undo">Ångra klistermärke</button>
          <button id="editor-back" type="button">Tillbaka</button>
        </div>
        <p id="editor-status" role="status"></p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
